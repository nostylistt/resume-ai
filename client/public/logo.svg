      <circle cx="12" cy="12" r="10"/>
      <circle cx="12" cy="12" r="6"/>
      <circle cx="12" cy="12" r="2"/>
    </svg>
  </g>
  
  <text x="32" y="23" class="logo-text">
    <tspan class="text-main">Resu</tspan><tspan class="text-highlight">match</tspan>
