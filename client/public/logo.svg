<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 32" width="160" height="32">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;display=swap');
      .logo-text {
        font-family: 'Outfit', system-ui, sans-serif;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .text-main { fill: #e5e7eb; }
      .text-highlight { fill: #3b82f6; }
      .icon { stroke: #3b82f6; }
    </style>
  </defs>
  
  <g transform="translate(0, 4)">
